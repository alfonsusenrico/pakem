# deploy/release.toml: how the release engine runs this project (contracts v1, section 4).
af_standard = 1
project = "example"
compose_files = ["compose.yaml"]

# In-image configuration check; prints names, never values. [] disables it.
preflight = ["python", "-m", "app.preflight", "--require-restricted-environment"]
# One-off migration container; [] when the project has no database.
migrate = ["python", "-m", "app.migrate"]
migrate_service = "web"
# How CI finds the newest migration identifier for the release record.
schema_version = { glob = "src/app/migrations/*.sql" }

# stop-start (default) or blue-green: routed services start beside the running ones and the
# proxy moves to them before the old ones stop. Blue-green needs a host proxy, routed
# services published on ephemeral loopback ports ("127.0.0.1::8000"), no state inside those
# services, and migrations the previous release can run against.
switch = "stop-start"
# Seconds running work may take to finish when the old release stops.
drain_seconds = 60

[health]
service = "web"
path = "/health/release"
revision_key = "revision"
# The service's container port; the engine asks Docker which 127.0.0.1 port publishes it.
port = 8000

[[images]]
name = "web"
dockerfile = "Dockerfile"
context = "."
platforms = ["linux/amd64", "linux/arm64"]

[[images]]
name = "worker"
dockerfile = "Dockerfile.worker"
context = "."

# Proxy routes, written by the engine on hosts with a [proxy] table: the domain in the
# placement value host_setting goes to the loopback port Docker published for the
# service's container port.
[[routes]]
host_setting = "PUBLIC_HOST"
service = "web"
port = 8000

[environments.staging]
keep = 3
backup = "optional"

[environments.production]
keep = 6
backup = "required"
