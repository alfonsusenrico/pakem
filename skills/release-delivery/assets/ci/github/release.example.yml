# Example caller for workflows/release.yml (contracts v1). Copy to .github/workflows/release.yml
# next to the verification workflows; the reusable workflow itself goes to
# .github/workflows/af-release.yml.
#
# - push to main      -> verify, build once, sign, move release-staging
# - push tag vX.Y.Z   -> promote that commit's staging record to release-production
# - manual run        -> roll an environment back to an earlier commit's record
#
# Protect `v*` tags (repository rulesets where the plan allows; otherwise only the owner
# has write access). Hosts with the pull agent pick up the new pointer themselves. For a
# host without the agent, set the repository variables AF_PUSH_<ENV>_HOST and
# AF_PUSH_<ENV>_KNOWN_HOSTS (and optionally _USER, _PORT) and the AF_PUSH_SSH_KEY secret;
# copy workflows/push-trigger.yml to .github/workflows/af-push.yml.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back.
        type: choice
        options: [staging, production]
      commit:
        description: Full SHA of the earlier commit to return to.
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify-python.yml
    permissions:
      contents: read

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/af-release.yml
    permissions:
      contents: read
      packages: write
    with:
      mode: publish
      commit: ${{ github.sha }}
      # Private repositories: build on the free self-hosted runner, host architecture only
      # (deployment contracts §11 step 8; release.toml `platforms = ["linux/amd64"]`).
      # runner: pakem
      # multi_architecture: false
    secrets: inherit

  promote:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/af-release.yml
    permissions:
      contents: read
      packages: write
    with:
      mode: promote
      commit: ${{ github.sha }}
      version: ${{ github.ref_name }}
    secrets: inherit

  rollback:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/af-release.yml
    permissions:
      contents: read
      packages: write
    with:
      mode: rollback
      commit: ${{ inputs.commit }}
      environment: ${{ inputs.environment }}
    secrets: inherit

  push-staging:
    needs: publish
    if: vars.AF_PUSH_STAGING_HOST != ''
    uses: ./.github/workflows/af-push.yml
    permissions:
      contents: read
    with:
      environment: staging
      host: ${{ vars.AF_PUSH_STAGING_HOST }}
      user: ${{ vars.AF_PUSH_STAGING_USER || 'af' }}
      port: ${{ fromJSON(vars.AF_PUSH_STAGING_PORT || '22') }}
      known_hosts: ${{ vars.AF_PUSH_STAGING_KNOWN_HOSTS }}
    secrets:
      AF_PUSH_SSH_KEY: ${{ secrets.AF_PUSH_SSH_KEY }}

  push-production:
    needs: promote
    if: vars.AF_PUSH_PRODUCTION_HOST != ''
    uses: ./.github/workflows/af-push.yml
    permissions:
      contents: read
    with:
      environment: production
      host: ${{ vars.AF_PUSH_PRODUCTION_HOST }}
      user: ${{ vars.AF_PUSH_PRODUCTION_USER || 'af' }}
      port: ${{ fromJSON(vars.AF_PUSH_PRODUCTION_PORT || '22') }}
      known_hosts: ${{ vars.AF_PUSH_PRODUCTION_KNOWN_HOSTS }}
    secrets:
      AF_PUSH_SSH_KEY: ${{ secrets.AF_PUSH_SSH_KEY }}
