# Pakem CI template: static security checks.
# Capability: always (required by `deployed`). Runs: gitleaks secret scan, dependency audits
# (pip-audit for uv projects, npm audit for npm projects), and CI/shell/Dockerfile lint
# (actionlint, shellcheck, hadolint) for files that exist.
# One job: the checks take seconds each, and separate jobs would each pay their own set-up
# and hold a runner. A failed check does not hide the others: every check still runs.
# Tools are downloaded at pinned versions and verified against SHA-256 checksums recorded in
# assets/ci/PINS.md; the binaries are linux x86_64, so use an x86_64 runner.
name: security

on:
  workflow_call:
    inputs:
      python_dir:
        description: Directory with pyproject.toml and uv.lock to audit; empty skips the Python audit.
        type: string
        default: ""
      node_dir:
        description: Directory with package.json and package-lock.json to audit; empty skips the npm audit.
        type: string
        default: ""
      uv_version:
        description: Exact uv version used to export the locked requirements.
        type: string
        default: "0.12.23"
      node_version:
        description: Node.js version used for npm audit.
        type: string
        default: "24"
      runner:
        description: Runner label (x86_64).
        type: string
        default: ubuntu-24.04
      timeout_minutes:
        description: Job timeout in minutes.
        type: number
        default: 15

permissions:
  contents: read

jobs:
  security:
    name: security
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A self-hosted runner keeps its tool cache between jobs, so each verified tool version
      # is downloaded once; GitHub-hosted runners start empty and download every time. The
      # cache belongs to the runner's user, which already runs every job's code.
      # The gitleaks CLI (MIT) is used instead of gitleaks-action, which needs a paid
      # license for organization repositories.
      - name: Install gitleaks, actionlint, shellcheck, and hadolint
        id: tools
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          HADOLINT_VERSION: 2.15.1
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          cache="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/pakem-ci"
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$cache" "$bin"

          # tool NAME SHA256 URL [MEMBER]: MEMBER is the binary's path in a tar archive; without
          # it the download is the binary. The cache entry is named by the verified checksum.
          tool() {
            local name=$1 sha=$2 url=$3 member=${4:-} cached
            cached="$cache/$name-$sha"
            if [[ ! -x "$cached" ]]; then
              local download="$RUNNER_TEMP/$name.download" unpacked="$RUNNER_TEMP/$name.unpacked"
              curl -fsSL --retry 3 -o "$download" "$url"
              echo "$sha  $download" | sha256sum --check --strict
              if [[ -n "$member" ]]; then
                mkdir -p "$unpacked"
                tar -xf "$download" -C "$unpacked" "$member"
                download="$unpacked/$member"
              fi
              # A rename is atomic, so a parallel job never runs a half-written binary.
              install -m 0755 "$download" "$cached.$$"
              mv -f "$cached.$$" "$cached"
            fi
            ln -sf "$cached" "$bin/$name"
          }

          releases=https://github.com
          tool gitleaks "$GITLEAKS_SHA256" \
            "$releases/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            gitleaks
          tool actionlint "$ACTIONLINT_SHA256" \
            "$releases/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            actionlint
          tool shellcheck "$SHELLCHECK_SHA256" \
            "$releases/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          tool hadolint "$HADOLINT_SHA256" \
            "$releases/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"

          echo "$bin" >> "$GITHUB_PATH"

      # Pull requests scan only their own commits; pushes scan the full history.
      # --redact keeps any finding's secret value out of the job log.
      - name: Scan for secrets
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            gitleaks git --redact --no-banner --exit-code 1 --log-opts="${BASE_SHA}..${HEAD_SHA}" .
          else
            gitleaks git --redact --no-banner --exit-code 1 .
          fi

      # actionlint also runs shellcheck on every `run:` block because shellcheck is on PATH.
      - name: Lint GitHub workflows
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          if compgen -G ".github/workflows/*.y*ml" > /dev/null; then
            actionlint
          else
            echo "No workflow files; nothing to lint."
          fi

      - name: Lint shell scripts
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          mapfile -t scripts < <(git ls-files -- '*.sh' '*.bash')
          if (( ${#scripts[@]} > 0 )); then
            shellcheck "${scripts[@]}"
          else
            echo "No shell scripts; nothing to lint."
          fi

      - name: Lint Dockerfiles
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          mapfile -t dockerfiles < <(git ls-files -- '*Dockerfile' '*Dockerfile.*' '*.dockerfile')
          if (( ${#dockerfiles[@]} > 0 )); then
            hadolint "${dockerfiles[@]}"
          else
            echo "No Dockerfiles; nothing to lint."
          fi

      - name: Set up uv
        id: uv
        if: ${{ !cancelled() && inputs.python_dir != '' }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ inputs.uv_version }}
          working-directory: ${{ inputs.python_dir }}

      # The export is fully pinned and hashed, so pip-audit can skip resolution (--disable-pip).
      # Workspace members and local path packages are project code, not dependencies.
      - name: Audit locked Python dependencies
        if: ${{ !cancelled() && steps.uv.outcome == 'success' }}
        working-directory: ${{ inputs.python_dir }}
        env:
          PIP_AUDIT_VERSION: 2.10.1
        run: |
          requirements="$RUNNER_TEMP/requirements-audit.txt"
          uv export --frozen --format requirements-txt --all-groups \
            --no-emit-workspace --no-emit-local --output-file "$requirements"
          uvx "pip-audit@${PIP_AUDIT_VERSION}" --strict --require-hashes --disable-pip -r "$requirements"

      - name: Set up Node.js
        id: node
        if: ${{ !cancelled() && inputs.node_dir != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          package-manager-cache: false

      - name: Audit locked npm dependencies
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        working-directory: ${{ inputs.node_dir }}
        run: npm audit --audit-level=high
