# Python tooling defaults from Pakem (assets/tooling/python).
# Merge these tables into the project's pyproject.toml; see README.md for setup.

[tool.ruff]
# target-version is inferred from [project] requires-python. Set it here only when the
# project has no requires-python (for example target-version = "py313").
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # import sorting
  "B",   # bugbear: likely bugs and design problems
  "UP",  # pyupgrade: syntax for the target Python version
  "S",   # bandit: security checks
  "SIM", # simplifications
  "RUF", # ruff-specific checks
]
# The formatter owns line length; it leaves long strings, URLs, and comments alone, so
# E501 would only report lines that cannot be wrapped mechanically.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert (S101) and fixture credentials for disposable services (S105, S106).
"tests/**/*.py" = ["S101", "S105", "S106"]
"**/test_*.py" = ["S101", "S105", "S106"]
"**/conftest.py" = ["S101", "S105", "S106"]

[tool.ruff.format]
# Ruff format defaults (double quotes, spaces, magic trailing commas) are the standard.

[tool.pyright]
# "standard" catches real type errors without demanding annotations for every untyped
# third-party call. Raise to "strict" for a new code base whose dependencies ship types,
# or per package with strict = ["src/<package>/domain"] once that code is clean.
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
markers = [
  "db: needs the disposable Postgres database; fails instead of skipping when REQUIRE_DB=1",
]
