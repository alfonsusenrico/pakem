<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Pakem</title>
  <desc id="desc">Pakem, one standard for every coding agent: a gunungan, the wayang mountain figure, as the shared core, linked by curved lines to small agent nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7EFE1"/><stop offset="1" stop-color="#EEDFC4"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DDAE55"/><stop offset="1" stop-color="#A8732B"/></linearGradient>
    <pattern id="kawung" width="40" height="40" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#6B4226" stroke-opacity="0.07" stroke-width="1.4">
        <ellipse cx="20" cy="9" rx="5.5" ry="9"/><ellipse cx="20" cy="31" rx="5.5" ry="9"/>
        <ellipse cx="9" cy="20" rx="9" ry="5.5"/><ellipse cx="31" cy="20" rx="9" ry="5.5"/>
      </g>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#kawung)"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="88" y="168" font-size="112" font-weight="800" letter-spacing="-3" fill="#4A2C17">pakem</text>
    <text x="92" y="222" font-size="31" font-weight="600" fill="#4A2C17">One standard for every coding agent.</text>
    <text x="93" y="262" font-size="19" fill="#8A6440">A framework for coding agents · every device · every project</text>
  </g>

  <g fill="none" stroke="#6B4226" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round">
    <path d="M846 96 C 880 104, 900 130, 922 152"/>
    <path d="M796 182 C 830 182, 860 184, 893 186"/>
    <path d="M846 268 C 864 262, 872 254, 884 246"/>
    <path d="M1114 96 C 1080 104, 1060 130, 1038 152"/>
    <path d="M1164 182 C 1130 182, 1100 184, 1067 186"/>
    <path d="M1114 268 C 1096 262, 1088 254, 1076 246"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle" fill="#6B4226">
    <g><circle cx="820" cy="92" r="25" fill="#FBF6EC" stroke="#6B4226" stroke-width="2"/><text x="820" y="98">&gt;_</text></g>
    <g><circle cx="770" cy="182" r="25" fill="#FBF6EC" stroke="#6B4226" stroke-width="2"/><text x="770" y="188">{ }</text></g>
    <g><circle cx="820" cy="272" r="25" fill="#FBF6EC" stroke="#6B4226" stroke-width="2"/><text x="820" y="278">&lt;/&gt;</text></g>
    <g><circle cx="1140" cy="92" r="25" fill="#FBF6EC" stroke="#6B4226" stroke-width="2"/><text x="1140" y="98">#</text></g>
    <g><circle cx="1190" cy="182" r="25" fill="#FBF6EC" stroke="#6B4226" stroke-width="2"/><text x="1190" y="188">✓</text></g>
    <g><circle cx="1140" cy="272" r="25" fill="#FBF6EC" stroke="#6B4226" stroke-width="2"/><text x="1140" y="278">λ</text></g>
  </g>

  <g transform="translate(980 34) scale(0.7 1.03)">
    <path d="M0 0 C 18 40, 60 80, 104 132 C 142 178, 154 216, 146 244 C 136 272, 96 282, 0 282 C -96 282, -136 272, -146 244 C -154 216, -142 178, -104 132 C -60 80, -18 40, 0 0 Z" fill="url(#gold)" stroke="#6B4226" stroke-width="3"/>
    <path d="M0 36 C 16 66, 48 100, 82 140 C 112 176, 122 206, 116 230 C 108 250, 80 258, 0 258 C -80 258, -108 250, -116 230 C -122 206, -112 176, -82 140 C -48 100, -16 66, 0 36 Z" fill="none" stroke="#FBF0D8" stroke-opacity="0.8" stroke-width="2"/>
    <g fill="none" stroke="#6B4226" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 56 L0 196"/><path d="M-34 108 L0 84 L34 108"/><path d="M-52 142 L0 112 L52 142"/><path d="M-68 176 L0 140 L68 176"/>
    </g>
    <path d="M-30 206 L0 186 L30 206 L30 254 L-30 254 Z" fill="#6B4226"/>
    <rect x="-6" y="222" width="12" height="32" rx="2" fill="#E9C47A"/>
