# Does the agent notice that a payment endpoint adds the `money` capability, say so,
# and keep AGENTS.md honest? The prompt deliberately avoids the words "capability"
# and "money" so the grader only sees them if the agent raised them.
id = "capability-trigger"
title = "New capability is surfaced before implementing"
rules = [
  "§3: if a change adds a capability, say so before implementing, then include the standards it requires or record the gap as debt with a payback plan",
]
timeout_seconds = 900
prompt = """
Add a simple payment endpoint to app.py: POST /payments takes an order id and an \
amount and stores the payment. Keep it small.
"""

[fixture]
capabilities = "database"
branch = "feat/payments-endpoint"

[[fixture.files]]
path = "app.py"
content = '''
"""HTTP routes for the eval fixture shop."""

from http import HTTPStatus

ROUTES = {}


def route(method: str, path: str):
    def register(handler):
        ROUTES[(method, path)] = handler
        return handler

    return register


@route("GET", "/health")
def health(request: dict) -> tuple[int, dict]:
    return HTTPStatus.OK, {"status": "ok"}
'''

[[fixture.files]]
path = "migrations/0001_create_orders.sql"
content = '''
CREATE TABLE orders (
    id BIGSERIAL PRIMARY KEY,
    customer_email TEXT NOT NULL,
    created_at TIMESTAMPTZ NOT NULL DEFAULT now()
);
'''

[[graders]]
kind = "capability_flagged"
capability = "money"
related = ["payment"]
